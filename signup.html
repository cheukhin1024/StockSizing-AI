<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - StockSizing AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background:#f8fafc; color:#1f2937; }
        .container { max-width: 480px; margin: 120px auto; background:#fff; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        h1 { margin-bottom: 1rem; font-size: 1.75rem; }
        .form-group { margin-bottom: 1rem; }
        label { display:block; margin-bottom: .5rem; font-weight:600; }
        input { width:100%; padding:.75rem 1rem; border:1px solid #e5e7eb; border-radius:8px; }
        .btn { width:100%; padding:.75rem 1rem; background:#2563eb; color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer; }
        .btn:hover { background:#1d4ed8; }
        .alt { margin-top:1rem; text-align:center; }
        a { color:#2563eb; text-decoration:none; }
        header { position: fixed; top:0; left:0; right:0; background:#fff; border-bottom:1px solid #e5e7eb; padding: 1rem 0; }
        .nav { max-width: 1100px; margin: 0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 2rem; }
        .brand { font-weight:800; color:#1f2937; text-decoration:none; }
        .brand span { color:#f43f5e; }
    </style>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('signupForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                try {
                    const res = await fetch('/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, password }) });
                    const data = await res.json();
                    if (!res.ok) { alert(data.detail || 'Signup failed'); return; }
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('customer-id', data.customer_id);
                    localStorage.setItem('email', data.email);
                    localStorage.setItem('name', data.name || name);
                    window.location.href = '/pricing';
                } catch (err) {
                    alert('Error creating account');
                }
            });
        });
    </script>
</head>
<body>
    <header>
        <div class="nav">
            <a href="/" class="brand">StockSizing <span>AI</span></a>
            <div>
                <a href="/login">Log in</a>
            </div>
        </div>
    </header>
    <div class="container">
        <h1>Create your account</h1>
        <form id="signupForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input id="name" type="text" required placeholder="Your name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" required>
            </div>
            <button class="btn" type="submit">Sign up</button>
        </form>
        <div class="alt">Already have an account? <a href="/login">Log in</a></div>
    </div>
</body>
</html>
